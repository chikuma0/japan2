<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <!-- Background -->
  <rect width="300" height="300" fill="#1a1a1a" />
  
  <!-- Border -->
  <rect x="10" y="10" width="280" height="280" fill="none" stroke="#33ff33" stroke-width="4" />
  <rect x="6" y="6" width="288" height="288" fill="none" stroke="#006400" stroke-width="2" rx="2" ry="2" />
  
  <!-- Title and Subtitle -->
  <text x="150" y="50" font-family="sans-serif" font-size="16" fill="#33ff33" text-anchor="middle" font-weight="bold">日本通</text>
  <text x="150" y="75" font-family="sans-serif" font-size="12" fill="#33ff33" text-anchor="middle">NIHON-TSŪ</text>
  
  <!-- Icon (Note: Emoji might not render in SVG, consider using an image or path instead) -->
  <text x="150" y="150" font-family="sans-serif" font-size="48" fill="#33ff33" text-anchor="middle">🗾</text>
  
  <!-- Stars -->
  <text x="130" y="220" font-family="sans-serif" font-size="24" fill="#ffcc00" text-anchor="middle">★</text><text x="160" y="220" font-family="sans-serif" font-size="24" fill="#ffcc00" text-anchor="middle">★</text><text x="190" y="220" font-family="sans-serif" font-size="24" fill="#ffcc00" text-anchor="middle">☆</text>
  
  <!-- Percentage -->
  <text x="150" y="250" font-family="sans-serif" font-size="14" fill="#33ff33" text-anchor="middle">70-89%</text>
</svg>