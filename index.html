<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japan-tsū</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            font-family: 'Press Start 2P', cursive;
            background-color: #0a0a0a;
            color: #33ff33;
            text-align: center;
            padding: 20px;
            line-height: 1.6;
        }

        h1 {
            font-size: 24px;
            color: #33ff33;
            text-shadow: 2px 2px 0px #006400;
            margin-bottom: 20px;
        }

        #game-container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #1a1a1a;
            border: 4px solid #33ff33;
            padding: 20px;
            box-shadow: 0 0 0 4px #006400, 0 0 10px rgba(51, 255, 51, 0.5);
        }

        #panorama, #map {
            height: 400px;
            width: 100%;
            margin-bottom: 20px;
            border: 2px solid #33ff33;
        }

        #timer {
            font-size: 24px;
            color: #33ff33;
            margin-bottom: 10px;
        }

        button {
            font-family: 'Press Start 2P', cursive;
            background-color: #006400;
            color: #33ff33;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 20px;
            image-rendering: pixelated;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #008000;
        }

        #score, #round {
            background-color: #0a0a0a;
            color: #33ff33;
            border: 2px solid #006400;
            padding: 10px;
            margin-bottom: 10px;
        }

        .pulse {
            animation: pulse 0.5s ease-in-out 3;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .result-card {
            width: 90%;
            max-width: 300px;
            height: auto;
            aspect-ratio: 1 / 1;
            margin: 20px auto;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        @media (max-width: 600px) {
            .result-card {
                width: 80%;
                max-width: 250px;
            }
        }

        .card-master { background-image: url('images/master-card.png'); }
        .card-expert { background-image: url('images/expert-card.png'); }
        .card-intermediate { background-image: url('images/intermediate-card.png'); }
        .card-beginner { background-image: url('images/beginner-card.png'); }
        .card-novice { background-image: url('images/novice-card.png'); }

        /* Add this to your CSS */
        #immersive-view {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
            display: none;
        }

        #panorama-fullscreen {
            width: 100%;
            height: 100%;
        }

        #mini-map-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 200px;
            height: 200px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 5px;
            overflow: hidden;
        }

        #mini-map {
            width: 100%;
            height: 100%;
        }

        #toggle-map {
            position: absolute;
            bottom: 5px;
            left: 5px;
            z-index: 1001;
        }

        #exit-immersive {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1002;
        }

        #immersive-timer {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1002;
            font-size: 24px;
            color: #33ff33;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <h1>Japan-tsū</h1>
        <div id="timer">2:00</div>
        <div id="panorama"></div>
        <div id="map"></div>
        <button id="submit-guess">Submit Guess</button>
        <div id="score">Total Score: 0</div>
        <div id="round">Round: 1 / 5</div>
        <div id="result" style="display: none;"></div>
    </div>

    <!-- Add this to your HTML -->
    <div id="immersive-view">
        <div id="panorama-fullscreen"></div>
        <div id="mini-map-container">
            <div id="mini-map"></div>
            <button id="toggle-map">Switch to Map</button>
        </div>
        <button id="exit-immersive">Exit Immersive Mode</button>
        <div id="immersive-timer"></div>
    </div>

    <!-- External Libraries -->
    <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCCQsM6IW_drrcpvIUBB545G9j4rUGVvIE&libraries=geometry&callback=initMap"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    
    <!-- Application JavaScript Modules -->
    <script type="module" src="js/index.js"></script>
</body>
</html>
