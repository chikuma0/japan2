<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japan-tsū</title>
    <!-- Replace inline styles with our new CSS structure -->
    <link rel="stylesheet" href="css/combined.css?v=1.0.3">
</head>
<body>
    <!-- Immersive View (now the main interface) -->
    <div class="immersive-view active" id="immersive-view">
        <!-- Fullscreen panorama -->
        <div class="panorama-fullscreen" id="panorama-fullscreen"></div>
        
        <!-- Game UI Overlay -->
        <div class="game-ui-overlay">
            <!-- Top bar with game info -->
            <div class="top-bar">
                <div class="game-logo">
                    <h1>Japan-tsū</h1>
                    <div class="mascot mascot-sm">
                        <div class="japan-mascot">
                            <div class="mascot-face">
                                <div class="mascot-eyes">
                                    <div class="mascot-eye"></div>
                                    <div class="mascot-eye"></div>
                                </div>
                                <div class="mascot-blush"></div>
                                <div class="mascot-mouth"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="round-info" id="immersive-round">Round: 1/5</div>
                <div class="score-info" id="immersive-score">Score: 0</div>
                <div class="timer" id="immersive-timer">2:00</div>
            </div>
            
            <!-- Compass -->
            <div class="compass" id="immersive-compass">
                <div class="compass-needle"></div>
                <span class="heading">0°</span>
                <span class="direction">N</span>
            </div>
            
            <!-- Navigation controls -->
            <div class="nav-controls">
                <div class="zoom-controls">
                    <button class="zoom-in" title="Zoom In">+</button>
                    <button class="zoom-out" title="Zoom Out">-</button>
                </div>
                <div class="movement-controls">
                    <button class="move-forward" title="Move Forward">↑</button>
                    <button class="move-backward" title="Move Backward">↓</button>
                </div>
                <div class="additional-controls">
                    <button class="return-to-start" title="Return to Start">⟲</button>
                    <button class="set-checkpoint" title="Set Checkpoint">📍</button>
                    <button class="undo-move" title="Undo Last Move">↩</button>
                    <button class="settings" title="Settings">⚙</button>
                </div>
            </div>
            
            <!-- Toggle Map Button -->
            <button class="toggle-map-btn" id="toggle-map">Switch to Map</button>
            
            <!-- Minimap for guessing -->
            <div class="minimap-container" id="minimap-container">
                <div class="minimap" id="minimap"></div>
                <button class="guess-btn" id="immersive-guess-btn" disabled>GUESS</button>
            </div>
            
            <!-- Results panel (hidden until round end) -->
            <div class="results-panel" id="immersive-results" style="display: none;">
                <!-- Content will be dynamically generated -->
            </div>
        </div>
    </div>

    <!-- Original Game Container (hidden) -->
    <div class="game-container" id="game-container" style="display: none;">
        <!-- Game Header -->
        <div class="game-header">
            <div class="game-logo">
                <h1>Japan-tsū</h1>
                <div class="mascot mascot-sm">
                    <div class="japan-mascot">
                        <div class="mascot-face">
                            <div class="mascot-eyes">
                                <div class="mascot-eye"></div>
                                <div class="mascot-eye"></div>
                            </div>
                            <div class="mascot-blush"></div>
                            <div class="mascot-mouth"></div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Game settings removed to streamline UI -->
        </div>

        <!-- New Three-Column Layout -->
        <div class="game-layout">
            <!-- Left Column -->
            <div class="game-column game-column-left">
                <!-- Game Info -->
                <div class="game-info">
                    <div class="score-display" id="score">Total Score: 0</div>
                    <div class="round-display" id="round">Round: 1 / 5</div>
                    <div class="progress" id="timer-progress">
                        <div class="progress-bar" style="width: 100%;"></div>
                    </div>
                </div>
                
                <!-- Result Display -->
                <div id="result" style="display: none;"></div>
                
                <!-- Left Ad Space -->
                <div class="ad-container ad-container-left">
                    <!-- Ad content will go here -->
                </div>
                
            </div>
    
            <!-- Center Column -->
            <div class="game-column game-column-center">
                <!-- Timer Display - Moved above panorama -->
                <div class="timer-display" id="timer">2:00</div>
                
                <!-- Panorama Viewer -->
                <div class="panorama-container" id="panorama"></div>
                
                <!-- Game Controls -->
                <div class="game-controls">
                    <button class="btn btn-primary" id="submit-guess">Submit Guess</button>
                    <button class="btn btn-secondary" id="toggle-immersive-btn">Immersive Mode</button>
                </div>
                
                <!-- Map Container -->
                <div class="map-container" id="map"></div>
                
            </div>
    
            <!-- Right Column -->
            <div class="game-column game-column-right">
                <!-- Location Info -->
                <div class="location-info" id="location-info" style="display: none;"></div>
    
                <!-- Right Ad Space -->
                <div class="ad-container ad-container-right">
                    <!-- Ad content will go here -->
                </div>
            </div>
        </div>
    
        <!-- Bottom Ad Space -->
        <div class="ad-container">
            <!-- Ad content will go here -->
        </div>
    </div>

    <!-- Loading Indicator -->
    <div class="loading-indicator" id="loading-indicator" style="display: none;">
        <div class="loading-spinner"></div>
        <p>Finding location...</p>
    </div>

    <!-- Confetti Container for Celebrations -->
    <div class="confetti-container" id="confetti-container"></div>

    <!-- External Libraries (non-Maps) -->
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    
    <!-- Application JavaScript Files -->
    <script src="js/locations-db.js"></script>
    <script src="js/map.js"></script>
    <script src="js/panorama.js"></script>
    <script src="js/location-generator.js"></script>
    <script src="js/journey-animation.js"></script>
    <script src="js/onboarding.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/game.js"></script>
    <script src="js/enhanced-sharing.js"></script>
    <script src="js/sharing.js"></script>
    <script src="js/index.js"></script>
    
    <!-- Google Maps API -->
    <script async defer
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB7zM7AafXQr2SL2ML96ocKzEjRqpopUFI&libraries=geometry&callback=initMap">
    </script>
</body>
</html>
