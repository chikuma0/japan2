<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japan-tsū</title>
    <!-- Replace inline styles with our new CSS structure -->
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <!-- Main Game Container -->
    <div class="game-container" id="game-container">
        <!-- Game Header -->
        <div class="game-header">
            <div class="game-logo">
                <h1>Japan-tsū</h1>
                <div class="mascot mascot-sm">
                    <div class="japan-mascot">
                        <div class="mascot-face">
                            <div class="mascot-eyes">
                                <div class="mascot-eye"></div>
                                <div class="mascot-eye"></div>
                            </div>
                            <div class="mascot-blush"></div>
                            <div class="mascot-mouth"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="game-settings">
                <button class="btn btn-sm btn-outline" id="settings-button">Settings</button>
            </div>
        </div>

        <!-- Timer Display -->
        <div class="timer-display" id="timer">2:00</div>

        <!-- Panorama Viewer -->
        <div class="panorama-container" id="panorama"></div>

        <!-- Game Info Grid -->
        <div class="game-info-grid">
            <!-- Map Container -->
            <div class="map-container" id="map"></div>

            <!-- Game Info -->
            <div class="game-info">
                <div class="score-display" id="score">Total Score: 0</div>
                <div class="round-display" id="round">Round: 1 / 5</div>
                <div class="progress" id="timer-progress">
                    <div class="progress-bar" style="width: 100%;"></div>
                </div>
            </div>
        </div>

        <!-- Game Controls -->
        <div class="game-controls">
            <button class="btn btn-primary" id="submit-guess">Submit Guess</button>
            <button class="btn btn-secondary" id="toggle-immersive-btn">Immersive Mode</button>
        </div>

        <!-- Result Display -->
        <div id="result" style="display: none;"></div>

        <!-- Location Info -->
        <div class="location-info" id="location-info" style="display: none;"></div>

        <!-- Ad Space -->
        <div class="ad-container">
            <!-- Ad content will go here -->
        </div>
    </div>

    <!-- Immersive View -->
    <div class="immersive-view" id="immersive-view">
        <div class="panorama-fullscreen" id="panorama-fullscreen"></div>
        <div class="mini-map-container" id="mini-map-container">
            <div class="mini-map" id="mini-map"></div>
            <button class="btn btn-sm btn-primary" id="toggle-map">Switch to Map</button>
        </div>
        <button class="btn btn-accent" id="exit-immersive">Exit Immersive Mode</button>
        <div class="immersive-timer" id="immersive-timer"></div>
    </div>

    <!-- Loading Indicator -->
    <div class="loading-indicator" id="loading-indicator" style="display: none;">
        <div class="loading-spinner"></div>
        <p>Finding location...</p>
    </div>

    <!-- Confetti Container for Celebrations -->
    <div class="confetti-container" id="confetti-container"></div>

    <!-- External Libraries (non-Maps) -->
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    
    <!-- Application JavaScript Modules -->
    <script type="module" src="js/index.js"></script>
    
    <!-- Google Maps API (loaded after our modules) -->
    <script>
        // This ensures our modules are loaded before Google Maps API tries to call initMap
        window.addEventListener('load', function() {
            // Create a script element for Google Maps API
            const script = document.createElement('script');
            
            // Try to load the API with a key first, but fall back to no key if there's an error
            const apiKey = 'AIzaSyB7zM7AafXQr2SL2ML96ocKzEjRqpopUFI';
            let apiUrl = `https://maps.googleapis.com/maps/api/js?key=${apiKey}&libraries=geometry&callback=initMap`;
            
            // Add error handling for API key issues
            script.onerror = function() {
                console.log("Error loading Google Maps API with key, trying without key...");
                const fallbackScript = document.createElement('script');
                fallbackScript.src = 'https://maps.googleapis.com/maps/api/js?libraries=geometry&callback=initMap';
                fallbackScript.async = true;
                fallbackScript.defer = true;
                document.body.appendChild(fallbackScript);
            };
            
            script.src = apiUrl;
            script.async = true;
            script.defer = true;
            document.body.appendChild(script);
            
            console.log('Loading Google Maps API:', apiUrl);
        });
    </script>
</body>
</html>
